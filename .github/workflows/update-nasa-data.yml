name: Update NASA data

on:
  schedule:
    - cron: "17 2 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/power_summary.py
      - name: Save new data
        run: |
          git config user.name "nasa-data-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/climate.json
          git diff --staged --quiet || git commit -m "Update NASA POWER climate data"
          git push
